name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading_system/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r trading_system/requirements.txt pytest
      - run: python -m compileall -q trading_system
      - run: cd trading_system && pytest -q
        env:
          PERPL_LIVE_TRADING: 'false'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.html
